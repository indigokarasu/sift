name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Script --help guards exit 0
        run: |
          set -e
          python3 scripts/wayback_fallback.py --help > /dev/null
          python3 scripts/webwright_runner.py --help > /dev/null
          bash scripts/update.sh --help > /dev/null
